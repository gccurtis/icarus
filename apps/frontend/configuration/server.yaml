# HTTP transport, worker pool, and queue bounds.

server:
  # Interface to bind.
  host: 0.0.0.0
  # HTTP port for Fastify.
  port: 4000
  # Maximum accepted request body, in bytes. A larger body is refused with 413
  # before any endpoint job sees it.
  bodyLimitBytes: 1048576
  # Milliseconds a request may take before the transport aborts it.
  requestTimeoutMs: 30000

workerPool:
  # Max number of concurrent jobs running at the same time.
  concurrentWorkers: 4

queue:
  # Max jobs waiting in the serial queue.
  serialMaxSize: 1000
  # Max jobs waiting in the concurrent queue.
  concurrentMaxSize: 1000
