# Backend runtime configuration.
# Keep environment-specific overrides in separate files if needed.

server:
  # Interface to bind.
  host: 0.0.0.0
  # HTTP port for Fastify.
  port: 4000

workerPool:
  # Max number of concurrent jobs running at the same time.
  concurrentWorkers: 4

queue:
  # Max jobs waiting in the serial queue.
  serialMaxSize: 1000
  # Max jobs waiting in the concurrent queue.
  concurrentMaxSize: 1000

logging:
  # Set to false to disable all file logging at runtime (all log calls become no-ops).
  enabled: true
  # Minimum level to record. One of: debug | info | warn | error
  level: info
  # Directory to write daily log files into, relative to the process working directory.
  directory: logs
