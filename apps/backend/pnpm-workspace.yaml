# Not a workspace. pnpm 11 stopped reading settings from package.json's "pnpm"
# field, and this file is where they live now — even for a standalone package.
#
# pnpm blocks dependency install scripts by default. Both of these are allowed
# deliberately:
#   better-sqlite3  a native N-API addon. It ships a prebuilt binary, so it works
#                   even when blocked, but allowing the script lets it fall back
#                   to compiling from source if a prebuild is ever unavailable.
#   esbuild         fetches its platform binary; arrives via tsx.
allowBuilds:
  better-sqlite3: true
  esbuild: true
