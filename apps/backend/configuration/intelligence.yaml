# Model providers and routing. The real API key belongs in local.yaml.

intelligence:
  providers:
    openrouter:
      # Do not put a real key here — this file is tracked.
      # Put it in local.yaml in this directory, which is git-ignored and is
      # merged over this file. OPENROUTER_API_KEY in the environment also works,
      # but only while this value is still the placeholder below.
      apiKey: replace-with-openrouter-api-key
      baseUrl: https://openrouter.ai/api/v1
      timeoutMs: 30000

  inference:
    routes:
      - purpose: general
        strength: low
        speed: low
        provider: openrouter
        model: openai/gpt-4.1-mini
        effort: low
