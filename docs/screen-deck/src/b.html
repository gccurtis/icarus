<style>
/* ============================================================
   Icarus screen deck — token layer.
   Values are lifted verbatim from
   app/src/lib/styles/chromatic-themes/{celestial,cyberpunk}
   and semantic-tokens/. Light = Celestial, dark = Cyberpunk.
   ============================================================ */
:root {
  color-scheme: light;

  --canvas:#f7f4ec; --work:#fffefa; --panel:#eeeae0; --elev:#ffffff; --panel-h:#e4dfd2;
  --bd:#d8d3c4; --bd-strong:#b9b3a1;
  --ink:#1d2329; --ink2:#3a424d; --ink3:#6c716c; --on-fill:#fffefa;

  --ok-s:#eff8f2;   --ok-b:#2e9160;   --ok-f:#1e7a46;   --ok-t:#145c34;
  --err-s:#fdf1ef;  --err-b:#d9483c;  --err-f:#c0362c;  --err-t:#92251d;
  --warn-s:#fef6e8; --warn-b:#b07a15; --warn-f:#8a5a13; --warn-t:#6b4510;
  --off-s:#f2f4f5;  --off-b:#6c716c;  --off-f:#3a424d;  --off-t:#1d2329;
  --act-s:#eaf6fb;  --act-b:#0087b8;  --act-f:#016e96;  --act-t:#02597a;
  --int-s:#eef1fb;  --int-b:#3657c9;  --int-f:#2a45a6;  --int-t:#1e3179;
  --ai-s:#f3effc;   --ai-b:#6f49d8;   --ai-f:#593aaf;   --ai-t:#412b80;
  --a1-s:#fdeff5;   --a1-b:#db4a88;   --a1-f:#bc386f;   --a1-t:#8e2853;
  --a2-s:#ecf8f7;   --a2-b:#1f9e92;   --a2-f:#187d74;   --a2-t:#115d57;

  --shadow-tint:#1d2329;
  --sel:color-mix(in srgb, var(--act-b) 22%, transparent);

  /* Deck bezel — one step outside the application in both themes. Its accents
   * are its own, because an app-theme accent picked for a paper ground is
   * unreadable on this one. */
  --bez:#191d21; --bez-2:#22272c; --bez-ink:#e4dfd2; --bez-ink2:#8f9aa3; --bez-bd:#333a41;
  --bez-accent:#a98bff; --bez-on:#38bdf8;

  --u:.25rem;
  --r-ctl:.375rem; --r-pan:.625rem; --r-ovl:1rem;
  --sh-pan:0 1px 2px color-mix(in srgb, var(--shadow-tint) 6%, transparent);
  --sh-rai:0 4px 10px -3px color-mix(in srgb, var(--shadow-tint) 18%, transparent);
  --sh-ovl:0 12px 32px -8px color-mix(in srgb, var(--shadow-tint) 18%, transparent);

  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --t-h4:1.25rem; --t-lg:1.125rem; --t-body:1rem; --t-sm:.875rem;
  --t-lab:.8125rem; --t-cap:.75rem; --t-mono:.8125rem;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --canvas:#141027; --work:#1b1734; --panel:#0d0a1b; --elev:#262145; --panel-h:#141027;
    --bd:#3b3563; --bd-strong:#554e7a;
    --ink:#f2fbff; --ink2:#a3c2d4; --ink3:#7e9baf; --on-fill:#05030c;
    --ok-s:#022d15;   --ok-b:#0fd165;   --ok-f:#2bff88;   --ok-t:#8fffb8;
    --err-s:#2e0511;  --err-b:#d91a4b;  --err-f:#ff3d6a;  --err-t:#ff9fb0;
    --warn-s:#2e2002; --warn-b:#d99a0f; --warn-f:#ffc22b; --warn-t:#ffde8a;
    --off-s:#12171a;  --off-b:#78838c;  --off-f:#a9b3ba;  --off-t:#d7dde1;
    --act-s:#052a33;  --act-b:#0ea5c6;  --act-f:#22d3ee;  --act-t:#9ff5ff;
    --int-s:#06132f;  --int-b:#2f74e6;  --int-f:#6f9dff;  --int-t:#a8c2ff;
    --ai-s:#18062f;   --ai-b:#8c4aec;   --ai-f:#a86bff;   --ai-t:#c9a8ff;
    --a1-s:#2f0622;   --a1-b:#e01fa0;   --a1-f:#ff5cc8;   --a1-t:#ffa8e0;
    --a2-s:#022d26;   --a2-b:#0fd1b4;   --a2-f:#2bffdd;   --a2-t:#8affee;
    --shadow-tint:#05030c;
    --bez:#08060f; --bez-2:#120f22; --bez-ink:#c2dcea; --bez-ink2:#5a7387; --bez-bd:#241f40;
    --bez-accent:#c9a8ff; --bez-on:#22d3ee;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --canvas:#141027; --work:#1b1734; --panel:#0d0a1b; --elev:#262145; --panel-h:#141027;
  --bd:#3b3563; --bd-strong:#554e7a;
  --ink:#f2fbff; --ink2:#a3c2d4; --ink3:#7e9baf; --on-fill:#05030c;
  --ok-s:#022d15;   --ok-b:#0fd165;   --ok-f:#2bff88;   --ok-t:#8fffb8;
  --err-s:#2e0511;  --err-b:#d91a4b;  --err-f:#ff3d6a;  --err-t:#ff9fb0;
  --warn-s:#2e2002; --warn-b:#d99a0f; --warn-f:#ffc22b; --warn-t:#ffde8a;
  --off-s:#12171a;  --off-b:#78838c;  --off-f:#a9b3ba;  --off-t:#d7dde1;
  --act-s:#052a33;  --act-b:#0ea5c6;  --act-f:#22d3ee;  --act-t:#9ff5ff;
  --int-s:#06132f;  --int-b:#2f74e6;  --int-f:#6f9dff;  --int-t:#a8c2ff;
  --ai-s:#18062f;   --ai-b:#8c4aec;   --ai-f:#a86bff;   --ai-t:#c9a8ff;
  --a1-s:#2f0622;   --a1-b:#e01fa0;   --a1-f:#ff5cc8;   --a1-t:#ffa8e0;
  --a2-s:#022d26;   --a2-b:#0fd1b4;   --a2-f:#2bffdd;   --a2-t:#8affee;
  --shadow-tint:#05030c;
  --bez:#08060f; --bez-2:#120f22; --bez-ink:#c2dcea; --bez-ink2:#5a7387; --bez-bd:#241f40;
  --bez-accent:#c9a8ff; --bez-on:#22d3ee;
}

*,*::before,*::after { box-sizing:border-box; }
/* Nothing shows a scrollbar. Every surface still scrolls; none of them spends
   width saying so, and no panel gets a gutter its neighbour lacks. */
* { scrollbar-width:none; }
*::-webkit-scrollbar { width:0; height:0; display:none; }
html,body { height:100%; }
body {
  margin:0; background:var(--bez); color:var(--ink);
  font-family:var(--sans); font-size:var(--t-sm); line-height:1.375rem;
  -webkit-font-smoothing:antialiased;
}
button { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--act-b); outline-offset:1px; border-radius:2px; }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;} }

/* ---------- deck bezel ---------- */
.deck { display:flex; flex-direction:column; height:100dvh; min-height:640px; }
.deckbar {
  flex:0 0 auto; display:flex; align-items:center; gap:calc(var(--u)*4);
  height:40px; padding-inline:calc(var(--u)*4);
  background:var(--bez); border-bottom:1px solid var(--bez-bd); color:var(--bez-ink);
}
.dk-id { display:flex; align-items:baseline; gap:calc(var(--u)*2); }
.dk-mark { font-size:var(--t-lab); font-weight:600; letter-spacing:.14em; }
.dk-sub { font-family:var(--mono); font-size:var(--t-cap); color:var(--bez-ink2); letter-spacing:.02em; }
.dk-nav { display:flex; align-items:center; gap:calc(var(--u)*2); margin-inline:auto; }
.dk-btn {
  display:inline-flex; align-items:center; gap:calc(var(--u)*1.5); height:26px;
  padding-inline:calc(var(--u)*2.5); border:1px solid var(--bez-bd); border-radius:var(--r-ctl);
  background:var(--bez-2); color:var(--bez-ink); font-size:var(--t-cap); cursor:pointer;
  transition:background 120ms ease;
}
.dk-btn:hover { background:var(--bez-bd); }
.dk-btn.is-on { border-color:var(--bez-on); color:var(--bez-on); }
.dk-btn[disabled] { opacity:.35; cursor:default; }
.dk-sel {
  height:26px; min-width:250px; padding-inline:calc(var(--u)*2);
  border:1px solid var(--bez-bd); border-radius:var(--r-ctl);
  background:var(--bez-2); color:var(--bez-ink); font:inherit; font-size:var(--t-cap); cursor:pointer;
}
.dk-count { font-family:var(--mono); font-size:var(--t-cap); color:var(--bez-ink2); font-variant-numeric:tabular-nums; min-width:52px; text-align:center; }
.dk-tools { display:flex; align-items:center; gap:calc(var(--u)*2); }

.stage { position:relative; flex:1; min-height:0; overflow:auto; background:var(--bez); }

/* ---------- the six-zone frame ---------- */
.frame {
  --z-top:44px; --z-tabs:36px; --z-status:26px;
  --z-ctx:320px; --z-insp:320px;
  /* The Copilot's width, shared by the status-bar button and the panel that
     rises out of it, so the two edges line up exactly. */
  --cop-w:520px;
  display:grid;
  grid-template-rows:var(--z-top) var(--z-tabs) 1fr var(--z-status);
  grid-template-columns:var(--z-ctx) 1fr var(--z-insp);
  grid-template-areas:"top top top" "tabs tabs tabs" "ctx work insp" "st st st";
  height:100%; min-height:600px; min-width:1180px; overflow:hidden;
  background:var(--canvas); color:var(--ink);
}
.z { min-width:0; min-height:0; }
.z-top{grid-area:top}.z-tabs{grid-area:tabs}.z-ctx{grid-area:ctx}
.z-work{grid-area:work;position:relative;overflow:hidden;background:var(--work)}
.z-insp{grid-area:insp}.z-st{grid-area:st}
.surface { height:100%; overflow:auto; background:var(--surface-bg, transparent); }
/* Zoom belongs to the work, not the window. Only what is inside this element
   scales — the bars, the panels and the rails are the same size at every zoom,
   which is the whole point of putting the control on the surface. */
.zoomer {
  width:100%; height:100%;
  transform:translate(var(--tx, 0px), var(--ty, 0px)) scale(var(--wz, 1));
  transform-origin:0 0;
  will-change:transform;
}

/* ---------- top bar ---------- */
.topbar {
  position:relative; height:100%; display:flex; align-items:center;
  padding-inline:calc(var(--u)*3); gap:calc(var(--u)*2);
  background:var(--panel); border-bottom:1px solid var(--bd);
}
.tb-left,.tb-right { display:flex; align-items:center; gap:calc(var(--u)*1.5); }
.tb-right { margin-inline-start:auto; }
/* The wordmark is the theme switch. One click, no extra control in the bar. */
.tb-wordmark {
  position:absolute; left:50%; transform:translateX(-50%);
  display:inline-flex; align-items:center; gap:calc(var(--u)*1.5);
  height:26px; padding-inline:calc(var(--u)*2); border:none; border-radius:var(--r-ctl);
  background:none; font-size:var(--t-lab); font-weight:600; letter-spacing:.08em;
  color:var(--ink2); cursor:pointer;
}
.tb-wordmark:hover { background:var(--panel-h); color:var(--ink); }
.tb-wordmark .ic { opacity:0; transition:opacity 120ms ease; }
.tb-wordmark:hover .ic { opacity:.6; }
.tb-proj {
  display:inline-flex; align-items:center; gap:calc(var(--u)*1.5); height:28px;
  padding-inline:calc(var(--u)*2); border:none; border-radius:var(--r-ctl);
  background:none; font-size:var(--t-lab); font-weight:500; cursor:pointer;
}
.tb-proj:hover { background:var(--panel-h); }
.ico-btn {
  display:inline-flex; align-items:center; justify-content:center; gap:calc(var(--u)*1.5);
  height:28px; min-width:28px; padding-inline:calc(var(--u)*1.5);
  border:none; border-radius:var(--r-ctl); background:none; color:var(--ink3); cursor:pointer;
}
.ico-btn:hover { background:var(--panel-h); color:var(--ink); }
.ico-btn[disabled] { opacity:.4; cursor:default; }
.ico-btn[disabled]:hover { background:none; color:var(--ink3); }
.ico-btn.is-txt { font-size:var(--t-lab); color:var(--ink2); padding-inline:calc(var(--u)*2); }
.kbd {
  font-family:var(--mono); font-size:var(--t-cap); color:var(--ink3);
  border:1px solid var(--bd); border-radius:4px; padding:1px 4px; background:var(--elev);
}
.presence { display:flex; align-items:center; }
.av {
  width:22px; height:22px; border-radius:50%; border:1.5px solid var(--panel);
  display:grid; place-items:center; font-size:10px; font-weight:600; color:var(--on-fill);
  margin-inline-start:-6px; flex:0 0 auto;
}
.av:first-child { margin-inline-start:0; }
.av.is-lg { width:48px; height:48px; font-size:17px; border-width:0; }
/* A standalone avatar is selectable. Hovering names the person; clicking
   inspects them. Never nested inside another button. */
.av-b { display:inline-flex; padding:0; border:none; background:none; border-radius:50%; cursor:pointer; flex:0 0 auto; }
.av-b .av { margin-inline-start:-6px; }
.av-b:first-child .av { margin-inline-start:0; }
.av-b:hover .av { border-color:var(--act-b); transform:translateY(-1px); }
.av-b:hover { z-index:1; }

/* ---------- tab strip ---------- */
/* Singletons are icon-only and grouped behind one divider; only the tabs a
   person actually opened and closes carry a label. That is the whole
   declutter — the permanent set stops competing for width. */
.tabstrip {
  height:100%; display:flex; align-items:stretch; overflow-x:auto; scrollbar-width:none;
  padding-inline:calc(var(--u)*2); background:var(--panel); border-bottom:1px solid var(--bd);
}
.tabstrip::-webkit-scrollbar { display:none; }
.tab { position:relative; display:flex; align-items:center; flex:0 0 auto; }
.tab-sel {
  display:flex; align-items:center; gap:calc(var(--u)*1.5); min-height:28px;
  padding-inline:calc(var(--u)*2.5); border:none; background:none;
  font-size:var(--t-lab); white-space:nowrap; color:var(--ink3); cursor:pointer; max-width:200px;
}
.tab-sel span { overflow:hidden; text-overflow:ellipsis; }
.tab.is-fix .tab-sel { padding-inline:calc(var(--u)*2); }
.tab:hover .tab-sel { color:var(--ink); }
.tab.is-on { background:var(--act-s); }
.tab.is-on .tab-sel { color:var(--act-t); }
.tab.is-on::after { content:""; position:absolute; inset-inline:0; bottom:0; height:2px; background:var(--act-b); }
.tab-x {
  display:grid; place-items:center; width:20px; height:20px; margin-inline-end:calc(var(--u)*1);
  border:none; border-radius:var(--r-ctl); background:none; color:var(--ink3); cursor:pointer;
}
.tab-x:hover { background:var(--panel-h); color:var(--ink); }
.tab-dot { width:6px; height:6px; border-radius:50%; background:var(--warn-b); flex:0 0 auto; }
.tab-div { width:1px; align-self:center; height:18px; background:var(--bd-strong); margin-inline:calc(var(--u)*2); flex:0 0 auto; }
.tab-add { display:grid; place-items:center; width:28px; margin-inline-start:calc(var(--u)*1); border:none; background:none; color:var(--ink3); cursor:pointer; border-radius:var(--r-ctl); }
.tab-add:hover { background:var(--panel-h); color:var(--ink); }

/* ---------- context panel ---------- */
.ctx { height:100%; display:flex; background:var(--panel); border-right:1px solid var(--bd); }
.rail {
  flex:0 0 44px; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding-block:calc(var(--u)*2); border-right:1px solid var(--bd); overflow-y:auto; scrollbar-width:none;
}
.rail::-webkit-scrollbar { display:none; }
.rail-b {
  position:relative; display:grid; place-items:center; width:32px; height:32px; flex:0 0 auto;
  border:none; border-radius:var(--r-ctl); background:none; color:var(--ink3); cursor:pointer;
}
.rail-b:hover { background:var(--panel-h); color:var(--ink); }
.rail-b.is-on { background:var(--act-s); color:var(--act-t); }
.rail-b.is-on::before { content:""; position:absolute; left:-8px; top:6px; bottom:6px; width:2px; border-radius:1px; background:var(--act-b); }
.ctxbody { flex:1; min-width:0; display:flex; flex-direction:column; }
.frame.ctx-shut .ctx .ctxbody { display:none; }
.frame.ctx-shut { --z-ctx:44px; }
.frame.insp-shut { --z-insp:44px; }

.pane-h {
  flex:0 0 auto; display:flex; align-items:center; gap:calc(var(--u)*2);
  height:32px; padding-inline:calc(var(--u)*3); border-bottom:1px solid var(--bd);
}
.pane-t { font-size:var(--t-lab); font-weight:600; letter-spacing:.01em; }
.pane-h .ico-btn { margin-inline-start:auto; height:22px; min-width:22px; }
.pane-s { flex:0 0 auto; padding:calc(var(--u)*2) calc(var(--u)*3) 0; }
/* Actions a screen owns sit at the top of its panel, not in a footer, so the
   thing you do most is the first thing under the header. */
.pane-a { flex:0 0 auto; display:flex; flex-wrap:wrap; gap:calc(var(--u)*1.5); padding:calc(var(--u)*2) calc(var(--u)*3); border-bottom:1px solid var(--bd); }
.pane-b { flex:1; min-height:0; overflow-y:auto; padding:calc(var(--u)*2) calc(var(--u)*2) calc(var(--u)*4); }
.pane-f { flex:0 0 auto; padding:calc(var(--u)*2) calc(var(--u)*3); border-top:1px solid var(--bd); display:flex; gap:calc(var(--u)*2); }

/* ---------- inspector ---------- */
.insp { height:100%; display:flex; flex-direction:column; background:var(--panel); border-left:1px solid var(--bd); }
.insp-rail {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*2);
  padding-block:calc(var(--u)*2); border:none; background:none; color:var(--ink3); cursor:pointer;
}
.insp-rail:hover { background:var(--panel-h); color:var(--ink); }
.insp-rail .vt { writing-mode:vertical-rl; font-size:var(--t-cap); letter-spacing:.08em; }
/* Ancestry is navigation, not decoration: every segment selects that object. */
.crumb { display:flex; align-items:center; flex-wrap:wrap; gap:1px; font-size:var(--t-cap); color:var(--ink3); min-width:0; }
.crumb-b { border:none; background:none; padding:1px 3px; border-radius:3px; font-size:var(--t-cap); color:var(--ink3); cursor:pointer; }
.crumb-b:hover { background:var(--panel-h); color:var(--act-t); text-decoration:underline; }
.crumb-b.is-here { color:var(--ink); font-weight:600; cursor:default; }
.crumb-b.is-here:hover { background:none; text-decoration:none; }
.crumb i { font-style:normal; opacity:.45; }
.insp-b { flex:1; min-height:0; overflow-y:auto; }

/* ---------- sections ---------- */
.sec { border-bottom:1px solid var(--bd); }
.sec-h {
  display:flex; align-items:center; gap:calc(var(--u)*2); width:100%;
  padding:calc(var(--u)*2) calc(var(--u)*3); border:none; background:none; cursor:pointer; text-align:left;
}
.sec-h:hover { background:var(--panel-h); }
.sec-t { font-size:var(--t-cap); font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink2); }
.sec-n { margin-inline-start:auto; font-family:var(--mono); font-size:var(--t-cap); color:var(--ink3); font-variant-numeric:tabular-nums; }
.sec-c { transition:transform 140ms ease; color:var(--ink3); display:flex; }
.sec.is-shut .sec-c { transform:rotate(-90deg); }
.sec.is-shut .sec-b { display:none; }
.sec-b { padding:0 calc(var(--u)*3) calc(var(--u)*3); display:flex; flex-direction:column; gap:calc(var(--u)*2); }
.sec-b.is-flush { padding-inline:0; gap:0; }

/* ---------- rows / lists ---------- */
.row {
  display:flex; align-items:center; gap:calc(var(--u)*2); width:100%; text-align:left;
  padding:calc(var(--u)*1.5) calc(var(--u)*3); border:none; background:none;
  border-radius:var(--r-ctl); cursor:pointer; color:inherit;
}
.row:hover { background:var(--panel-h); }
.row.is-on { background:var(--act-s); box-shadow:inset 2px 0 0 var(--act-b); }
.row-i { flex:0 0 auto; color:var(--ink3); display:flex; }
.row.is-on .row-i { color:var(--act-t); }
.row-m { flex:1; min-width:0; display:flex; flex-direction:column; }
.row-t { display:block; min-width:0; font-size:var(--t-lab); line-height:1.125rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row-s { display:block; min-width:0; font-size:var(--t-cap); line-height:1rem; color:var(--ink3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px; }
.row-x { flex:0 0 auto; font-family:var(--mono); font-size:var(--t-cap); color:var(--ink3); font-variant-numeric:tabular-nums; }
.row.is-sub { padding-inline-start:calc(var(--u)*7); }

/* ---------- controls ---------- */
.inp {
  display:flex; align-items:center; gap:calc(var(--u)*2); height:28px; width:100%;
  padding-inline:calc(var(--u)*2); border:1px solid var(--bd); border-radius:var(--r-ctl);
  background:var(--elev); color:var(--ink3); font-size:var(--t-lab);
  /* Bare text inside behaves like an input's value: one line, clipped. */
  white-space:nowrap; overflow:hidden;
}
.inp.is-filled { color:var(--ink); }
.inp-w { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:calc(var(--u)*1.5);
  height:28px; padding-inline:calc(var(--u)*3); border:1px solid var(--bd); border-radius:var(--r-ctl);
  background:var(--elev); font-size:var(--t-lab); cursor:pointer; white-space:nowrap;
}
.btn:hover { background:var(--panel-h); }
.btn.is-pri { background:var(--int-f); border-color:var(--int-f); color:var(--on-fill); font-weight:500; }
.btn.is-pri:hover { background:var(--int-b); border-color:var(--int-b); }
.btn.is-ai { background:var(--ai-s); border-color:var(--ai-b); color:var(--ai-t); }
.btn.is-dgr { border-color:var(--err-b); color:var(--err-t); background:var(--err-s); }
.btn.is-gh { border-color:transparent; background:none; color:var(--ink2); }
.btn.is-gh:hover { background:var(--panel-h); }
.btn[disabled] { opacity:.45; cursor:default; }
.btn[disabled]:hover { background:var(--elev); }
.btn.is-sm { height:22px; padding-inline:calc(var(--u)*2); font-size:var(--t-cap); }
.btn.is-big { height:34px; padding-inline:calc(var(--u)*4); font-size:var(--t-sm); }
.btn-row { display:flex; flex-wrap:wrap; gap:calc(var(--u)*2); }

.chip {
  display:inline-flex; align-items:center; gap:calc(var(--u)*1.5); height:22px;
  padding-inline:calc(var(--u)*2); border-radius:999px; border:1px solid var(--bd);
  background:var(--elev); font-size:var(--t-cap); white-space:nowrap; color:var(--ink2);
}
.chip.t-ok{background:var(--ok-s);border-color:var(--ok-b);color:var(--ok-t)}
.chip.t-err{background:var(--err-s);border-color:var(--err-b);color:var(--err-t)}
.chip.t-warn{background:var(--warn-s);border-color:var(--warn-b);color:var(--warn-t)}
.chip.t-act{background:var(--act-s);border-color:var(--act-b);color:var(--act-t)}
.chip.t-ai{background:var(--ai-s);border-color:var(--ai-b);color:var(--ai-t)}
.chip.t-int{background:var(--int-s);border-color:var(--int-b);color:var(--int-t)}
.chip.t-a1{background:var(--a1-s);border-color:var(--a1-b);color:var(--a1-t)}
.chip.t-a2{background:var(--a2-s);border-color:var(--a2-b);color:var(--a2-t)}
.chip.t-off{background:var(--off-s);border-color:var(--off-b);color:var(--off-t)}
.chip.is-sq { border-radius:var(--r-ctl); font-family:var(--mono); }
.chips { display:flex; flex-wrap:wrap; gap:calc(var(--u)*1.5); align-items:center; }

.tog { display:inline-flex; align-items:center; width:26px; height:15px; border-radius:999px; border:1px solid var(--bd); background:var(--off-s); padding:1px; flex:0 0 auto; }
.tog::after { content:""; width:11px; height:11px; border-radius:50%; background:var(--ink3); }
.tog.is-on { background:var(--ok-s); border-color:var(--ok-b); justify-content:flex-end; }
.tog.is-on::after { background:var(--ok-f); }

/* ---------- field pairs ---------- */
.fld { display:grid; grid-template-columns:94px 1fr; gap:calc(var(--u)*2); align-items:baseline; }
.fld-k { font-size:var(--t-cap); color:var(--ink3); }
.fld-v { font-size:var(--t-lab); min-width:0; overflow-wrap:anywhere; }
.fld-v.is-mono { font-family:var(--mono); font-size:var(--t-mono); }
.note { margin:0; font-size:var(--t-cap); line-height:1rem; color:var(--ink3); }
.note.is-warn { color:var(--warn-t); }
.quote-v {
  padding:calc(var(--u)*2); border-inline-start:2px solid var(--act-b); border-radius:0 var(--r-ctl) var(--r-ctl) 0;
  background:var(--sel); font-size:var(--t-lab); line-height:1.25rem; color:var(--ink);
}
.gap-note {
  display:flex; gap:calc(var(--u)*2); padding:calc(var(--u)*2); border-radius:var(--r-ctl);
  background:var(--warn-s); border:1px solid var(--warn-b); color:var(--warn-t);
  font-size:var(--t-cap); line-height:1rem;
}
.gap-note .row-i { color:inherit; }

/* ---------- center furniture ---------- */
.wrap { padding:calc(var(--u)*6) calc(var(--u)*8) calc(var(--u)*10); max-width:1120px; margin:0 auto; display:flex; flex-direction:column; gap:calc(var(--u)*6); }
.wrap.is-wide { max-width:none; }
.hd { display:flex; align-items:flex-start; gap:calc(var(--u)*3); }
.hd-m { flex:1; min-width:0; display:flex; flex-direction:column; gap:calc(var(--u)*1); }
.hd-t { font-size:var(--t-h4); font-weight:600; letter-spacing:-.01em; text-wrap:balance; margin:0; }
.hd-s { font-size:var(--t-lab); color:var(--ink3); }
.hd-a { display:flex; align-items:center; gap:calc(var(--u)*2); flex-wrap:wrap; }
.eyebrow { font-size:var(--t-cap); font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); }

/* A thin screen-level strip. It carries identity and one or two screen verbs —
   never formatting, which belongs to the inspector. */
.shead {
  position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:calc(var(--u)*3);
  height:36px; padding-inline:calc(var(--u)*4); background:var(--panel); border-bottom:1px solid var(--bd);
}
.shead-t { font-size:var(--t-lab); font-weight:600; }
.shead-r { margin-inline-start:auto; display:flex; align-items:center; gap:calc(var(--u)*2); }

/* cards, pills & tables */
.cards { display:grid; gap:calc(var(--u)*3); grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); }
.card {
  display:flex; flex-direction:column; gap:calc(var(--u)*2); padding:calc(var(--u)*3);
  border:1px solid var(--bd); border-radius:var(--r-pan); background:var(--elev);
  cursor:pointer; text-align:left; box-shadow:var(--sh-pan); color:inherit;
}
.card:hover { border-color:var(--bd-strong); box-shadow:var(--sh-rai); }
.card.is-on { border-color:var(--act-b); box-shadow:0 0 0 1px var(--act-b); }
.card-t { font-size:var(--t-lab); font-weight:600; }
.card-s { font-size:var(--t-cap); color:var(--ink3); line-height:1rem; }
.card-i { color:var(--ink3); display:flex; }
.card.is-on .card-i { color:var(--act-t); }

/* One thing to make, said once. */
.mkpill {
  display:inline-flex; align-items:center; gap:calc(var(--u)*2); height:36px;
  padding-inline:calc(var(--u)*4); border:1px solid var(--bd); border-radius:999px;
  background:var(--elev); font-size:var(--t-sm); cursor:pointer; color:inherit; box-shadow:var(--sh-pan);
}
.mkpill:hover { border-color:var(--bd-strong); box-shadow:var(--sh-rai); }
.mkpill.is-on { border-color:var(--act-b); background:var(--act-s); color:var(--act-t); box-shadow:0 0 0 1px var(--act-b); }
.mkpill .ic { color:var(--ink3); }
.mkpill.is-on .ic { color:var(--act-t); }

/* Horizontal shelf — templates and recents scroll rather than stack. */
.carousel { display:flex; gap:calc(var(--u)*3); overflow-x:auto; padding-bottom:calc(var(--u)*2); scroll-snap-type:x proximity; }
.carousel > * { flex:0 0 190px; scroll-snap-align:start; }

.tbl-w { border:1px solid var(--bd); border-radius:var(--r-pan); background:var(--elev); overflow:hidden; }
.tbl-c { overflow-x:auto; }
.tbl { width:100%; border-collapse:collapse; font-size:var(--t-lab); }
.tbl th {
  text-align:left; font-size:var(--t-cap); font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  color:var(--ink3); padding:calc(var(--u)*2) calc(var(--u)*3); border-bottom:1px solid var(--bd); white-space:nowrap;
}
.tbl td { padding:calc(var(--u)*2) calc(var(--u)*3); border-bottom:1px solid var(--bd); vertical-align:middle; }
.tbl tr:last-child td { border-bottom:0; }
.tbl tbody tr { cursor:pointer; }
.tbl tbody tr:hover td { background:var(--panel-h); }
.tbl tbody tr.is-on td { background:var(--act-s); }
.tbl tbody tr.is-on td:first-child { box-shadow:inset 2px 0 0 var(--act-b); }
.tbl .num { font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink3); font-size:var(--t-mono); white-space:nowrap; }
.cellname { display:flex; align-items:center; gap:calc(var(--u)*2); }
.cellname .row-i { color:var(--ink3); }

/* ---------- status bar, and the Copilot that rises out of it ---------- */
.statusbar {
  height:100%; display:grid; grid-template-columns:1fr auto 1fr; align-items:stretch;
  background:var(--panel); border-top:1px solid var(--bd);
  font-size:var(--t-cap); color:var(--ink3);
}
.st-sect { display:flex; align-items:center; gap:calc(var(--u)*3); padding-inline:calc(var(--u)*3); min-width:0; overflow:hidden; }
.st-sect.is-right { justify-content:flex-end; }
.st-sect.is-mid { padding:0; border-inline:1px solid var(--bd); }
.st-i { display:inline-flex; align-items:center; gap:calc(var(--u)*1); white-space:nowrap; }
.st-i.t-ok{color:var(--ok-t)}.st-i.t-warn{color:var(--warn-t)}.st-i.t-err{color:var(--err-t)}
.st-i.t-ai{color:var(--ai-t)}.st-i.t-act{color:var(--act-t)}
.st-sep { width:1px; height:12px; background:var(--bd); flex:0 0 auto; }
.zm-tag {
  position:absolute; right:calc(var(--u)*3); bottom:calc(var(--u)*3); z-index:25;
  display:inline-flex; align-items:center; height:22px;
  padding-inline:calc(var(--u)*2.5); border:1px solid var(--bd); border-radius:999px;
  background:var(--elev); cursor:pointer;
  font-family:var(--mono); font-size:var(--t-cap); font-variant-numeric:tabular-nums; color:var(--ink3);
  opacity:.12; transition:opacity 320ms ease, color 160ms ease, border-color 160ms ease;
}
/* Away from 100% it is a way back, so it stops hiding. */
.zm-tag.is-off100 { opacity:.6; color:var(--act-t); border-color:var(--act-b); background:var(--act-s); }
/* While the gesture is happening, it is the thing you are reading. */
.zm-tag.is-live { opacity:1; transition:opacity 60ms ease; }
.zm-tag:hover { opacity:1; color:var(--ink); border-color:var(--bd-strong); }
.frame[data-zoomable="no"] .zm-tag { display:none; }

/* The centre section IS the Copilot. Closed it is one plain button; open, the
   same width of bar rises straight up out of the status row. */
.cop-btn {
  display:flex; align-items:center; justify-content:center; gap:calc(var(--u)*2);
  width:var(--cop-w); height:100%; border:none; background:none;
  font-size:var(--t-cap); color:var(--ink2); cursor:pointer;
}
.cop-btn:hover { background:var(--panel-h); color:var(--ink); }
.cop-btn.is-on { background:var(--ai-s); color:var(--ai-t); font-weight:600; }
.cop-btn .ic { color:var(--ai-t); }
.cop-badge { font-family:var(--mono); font-variant-numeric:tabular-nums; }

.cop-lift {
  position:absolute; bottom:0; left:50%; transform:translateX(-50%);
  width:var(--cop-w); max-height:64%; z-index:30;
  display:flex; flex-direction:column; overflow:hidden;
  background:var(--elev); border:1px solid var(--bd); border-bottom:0;
  border-radius:var(--r-pan) var(--r-pan) 0 0; box-shadow:var(--sh-ovl);
}
.cop-h {
  display:flex; align-items:center; gap:calc(var(--u)*2); flex:0 0 auto;
  padding:calc(var(--u)*2) calc(var(--u)*3); background:var(--panel); border-bottom:1px solid var(--bd);
}
.cop-h .pane-t { color:var(--ai-t); }
.cop-b { flex:1; min-height:0; overflow-y:auto; }
.cop-f { flex:0 0 auto; border-top:1px solid var(--bd); padding:calc(var(--u)*2) calc(var(--u)*3); display:flex; flex-direction:column; gap:calc(var(--u)*2); background:var(--elev); }
.cop-row { display:flex; align-items:center; gap:calc(var(--u)*2); }
.cop-sel { display:inline-flex; align-items:center; gap:calc(var(--u)*1.5); height:24px; padding-inline:calc(var(--u)*2); border:1px solid var(--bd); border-radius:var(--r-ctl); background:var(--elev); font-size:var(--t-cap); cursor:pointer; }
.cop-sel:hover { background:var(--panel-h); }
.cop-sel.is-mode { color:var(--ai-t); font-weight:600; border-color:var(--ai-b); background:var(--ai-s); }
.cop-in { display:flex; align-items:flex-start; gap:calc(var(--u)*2); }
.cop-txt { flex:1; min-height:34px; padding:calc(var(--u)*2); border:1px solid var(--bd); border-radius:var(--r-ctl); background:var(--work); color:var(--ink3); font-size:var(--t-lab); }
.cop-send { display:grid; place-items:center; width:28px; height:28px; flex:0 0 auto; border:none; border-radius:var(--r-ctl); background:var(--int-f); color:var(--on-fill); cursor:pointer; }

/* modal overlay (New Slide) */
.ovl { position:absolute; inset:0; z-index:40; display:grid; place-items:center; padding:calc(var(--u)*8); background:color-mix(in srgb, var(--shadow-tint) 34%, transparent); }
.ovl-p { width:min(760px,100%); max-height:100%; display:flex; flex-direction:column; overflow:hidden; background:var(--elev); border:1px solid var(--bd-strong); border-radius:var(--r-ovl); box-shadow:var(--sh-ovl); }
.ovl-h { display:flex; align-items:center; gap:calc(var(--u)*3); padding:calc(var(--u)*3) calc(var(--u)*4); border-bottom:1px solid var(--bd); }
.ovl-b { flex:1; min-height:0; overflow-y:auto; padding:calc(var(--u)*4); display:flex; flex-direction:column; gap:calc(var(--u)*4); }
.ovl-f { display:flex; align-items:center; gap:calc(var(--u)*2); padding:calc(var(--u)*3) calc(var(--u)*4); border-top:1px solid var(--bd); background:var(--panel); }

/* ---------- document: a full page with gutters on all four sides ---------- */
/* The page floats. Gutter on all four sides and between pages, all of it the
   canvas rather than more paper, so the document reads as an object sitting on
   a surface — the same relationship a slide has to its pasteboard. */
.pasteboard {
  background:var(--canvas); min-height:100%;
  padding:calc(var(--u)*8) calc(var(--u)*10) calc(var(--u)*12);
  display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*8);
}
.page {
  width:min(816px, 100%); aspect-ratio:8.5 / 11; flex:0 0 auto; background:var(--elev); border:1px solid var(--bd);
  box-shadow:var(--sh-rai); position:relative;
  display:grid; grid-template-rows:9% 1fr 9%; grid-template-columns:11.7% 1fr 11.7%;
  grid-template-areas:"gl head gr" "gl body gr" "gl foot gr";
}
/* The four gutters are drawn, not implied — margins, header and footer are
   part of what a page IS. */
.page::before {
  content:""; position:absolute; inset:9% 11.7%; pointer-events:none;
  outline:1px dashed color-mix(in srgb, var(--act-b) 34%, transparent);
}
.pg-head { grid-area:head; display:flex; align-items:center; }
.pg-foot { grid-area:foot; display:flex; align-items:flex-end; }
.pg-body { grid-area:body; display:flex; flex-direction:column; gap:calc(var(--u)*3); min-height:0; }
.furn {
  width:100%; padding:calc(var(--u)*1) calc(var(--u)*2); border-radius:3px; cursor:pointer;
  font-size:var(--t-cap); color:var(--ink3); border:1px dashed transparent; text-align:left; background:none;
  display:flex; align-items:center;
}
.furn:hover { border-color:var(--bd-strong); color:var(--ink2); }
.furn.is-on { border-color:var(--act-b); border-style:solid; background:var(--act-s); color:var(--act-t); }
.pg-n { margin-inline-start:auto; font-family:var(--mono); }
.dh1 { font-size:1.5rem; line-height:2rem; font-weight:600; margin:0; letter-spacing:-.01em; }
.dh2 { font-size:1.125rem; line-height:1.75rem; font-weight:600; margin:0; }
.dp { font-size:.9375rem; line-height:1.625rem; margin:0; color:var(--ink2); }
.dp.is-sel { background:var(--sel); border-radius:2px; }
.blk { position:relative; border-radius:4px; cursor:pointer; padding:2px 4px; margin-inline:-4px; }
.blk:hover { background:var(--panel-h); }
.blk.is-on { box-shadow:0 0 0 1.5px var(--act-b); background:var(--act-s); }
/* Formula and prompt wear the intelligence role and only that. A value is
   pulled when it is read, so there is no stale variant to paint. */
.atom { background:var(--ai-s); border-bottom:1.5px solid var(--ai-b); border-radius:2px; padding:0 3px; color:var(--ai-t); cursor:pointer; }
.pblock { border:1px solid var(--ai-b); border-radius:var(--r-pan); background:var(--ai-s); padding:calc(var(--u)*3); display:flex; flex-direction:column; gap:calc(var(--u)*2); cursor:pointer; }
.pblock-h { display:flex; align-items:center; gap:calc(var(--u)*2); font-size:var(--t-cap); color:var(--ai-t); font-weight:600; letter-spacing:.04em; text-transform:uppercase; }

/* ---------- slides ---------- */
.canvas { background:var(--canvas); flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:calc(var(--u)*6); gap:calc(var(--u)*4); min-height:0; }
.slide { width:min(760px,100%); aspect-ratio:16/9; background:var(--elev); border:1px solid var(--bd); box-shadow:var(--sh-rai); position:relative; }
.el { position:absolute; border:1px solid transparent; border-radius:2px; padding:calc(var(--u)*2); cursor:pointer; display:flex; flex-direction:column; gap:calc(var(--u)*1); }
.el:hover { border-color:var(--bd-strong); }
.el.is-on { border-color:var(--act-b); box-shadow:0 0 0 1px var(--act-b); }
.el.is-lock { border-style:dashed; border-color:var(--off-b); opacity:.75; cursor:not-allowed; }
.hnd { position:absolute; width:7px; height:7px; background:var(--elev); border:1.5px solid var(--act-b); border-radius:1px; }
.thumb { display:block; flex:0 0 auto; width:100%; aspect-ratio:16/9; background:var(--elev); border:1px solid var(--bd); border-radius:3px; position:relative; overflow:hidden; }
.thumb.is-on { border-color:var(--act-b); box-shadow:0 0 0 1px var(--act-b); }
.thumb-l { position:absolute; background:color-mix(in srgb, var(--ink3) 22%, transparent); border-radius:1px; }
.strip-row { display:flex; align-items:flex-start; gap:calc(var(--u)*2); padding:calc(var(--u)*1.5) calc(var(--u)*2); border-radius:var(--r-ctl); cursor:pointer; width:100%; border:none; background:none; text-align:left; color:inherit; }
.strip-row:hover { background:var(--panel-h); }
.strip-row.is-on { background:var(--act-s); }
.strip-n { font-family:var(--mono); font-size:var(--t-cap); color:var(--ink3); width:16px; flex:0 0 auto; padding-top:2px; font-variant-numeric:tabular-nums; }
.strip-t { flex:1; min-width:0; display:flex; flex-direction:column; }

/* ---------- spreadsheet ---------- */
.grid-w { display:flex; flex-direction:column; height:100%; min-height:0; }
.gscroll { flex:1; min-height:0; overflow:auto; background:var(--work); }
.gt { border-collapse:collapse; font-size:var(--t-lab); table-layout:fixed; }
.gt th,.gt td { border:1px solid var(--bd); height:24px; padding:0 calc(var(--u)*1.5); white-space:nowrap; overflow:hidden; }
.gt th { background:var(--panel); color:var(--ink3); font-size:var(--t-cap); font-weight:500; text-align:center; position:sticky; top:0; z-index:2; }
.gt th.rh { position:sticky; left:0; z-index:3; width:38px; }
.gt td.rh { background:var(--panel); color:var(--ink3); font-size:var(--t-cap); text-align:center; position:sticky; left:0; z-index:1; font-family:var(--mono); }
.gt td { background:var(--elev); cursor:cell; }
.gt td.n { font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; font-size:var(--t-mono); }
.gt td.f { color:var(--ai-t); }
.gt td.is-on { box-shadow:inset 0 0 0 2px var(--act-b); }
.gt td.is-rng { background:var(--sel); }
.gt td.is-spill { background:var(--a2-s); color:var(--a2-t); }
.gt td.is-err { background:var(--err-s); color:var(--err-t); font-family:var(--mono); font-size:var(--t-mono); }

/* ---------- research ---------- */
/* Anchored to the current prompt: the turn on the left, what it produced on
   the right. History is a rail, not a scrollback you live in. */
.turn { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:calc(var(--u)*5); align-items:start; }
.ask { border:1px solid var(--bd); border-radius:var(--r-pan); background:var(--panel); padding:calc(var(--u)*3) calc(var(--u)*4); display:flex; flex-direction:column; gap:calc(var(--u)*2); }
.ask-q { font-size:var(--t-lg); line-height:1.75rem; font-weight:500; margin:0; letter-spacing:-.01em; }
.answer { display:flex; flex-direction:column; gap:calc(var(--u)*3); }
.finding-c { border:1px solid var(--a2-b); border-radius:var(--r-pan); background:var(--a2-s); padding:calc(var(--u)*3); display:flex; flex-direction:column; gap:calc(var(--u)*2); cursor:pointer; text-align:left; color:inherit; width:100%; }
.finding-c:hover { box-shadow:var(--sh-rai); }
.finding-c.is-on { box-shadow:0 0 0 1px var(--a2-b); }
.finding-c.is-accepted { background:var(--elev); border-color:var(--bd); }
.cite { display:flex; gap:calc(var(--u)*2); padding:calc(var(--u)*2); border:1px solid var(--bd); border-left:2px solid var(--a2-b); border-radius:0 var(--r-ctl) var(--r-ctl) 0; background:var(--elev); cursor:pointer; text-align:left; color:inherit; }
.cite:hover { border-color:var(--bd-strong); border-left-color:var(--a2-b); }
.cite-m { min-width:0; display:flex; flex-direction:column; gap:2px; }
.trace { display:flex; align-items:center; gap:calc(var(--u)*2); padding:calc(var(--u)*1.5) calc(var(--u)*2); border:1px solid var(--bd); border-radius:var(--r-ctl); background:var(--panel); font-size:var(--t-cap); color:var(--ink2); cursor:pointer; font-family:var(--mono); }
.trace:hover { border-color:var(--bd-strong); }

/* ---------- analysis ---------- */
/* The chart is the subject: centred, at the top, before any control. */
.plot { border:1px solid var(--bd); border-radius:var(--r-pan); background:var(--elev); padding:calc(var(--u)*4); display:flex; flex-direction:column; gap:calc(var(--u)*3); }
.bars { display:flex; align-items:flex-end; gap:calc(var(--u)*3); height:200px; padding-inline:calc(var(--u)*2); border-bottom:1px solid var(--bd); }
.bar-g { flex:1; display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*1); height:100%; justify-content:flex-end; cursor:pointer; }
.bar { width:100%; max-width:56px; border-radius:3px 3px 0 0; background:var(--int-f); transition:opacity 120ms ease; }
.bar-g:hover .bar { opacity:.8; }
.bar-g.is-on .bar { background:var(--act-f); }
.bar-l { font-size:var(--t-cap); color:var(--ink3); }
.drops { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:calc(var(--u)*3); }
.drop {
  display:flex; flex-direction:column; gap:calc(var(--u)*2); min-height:64px;
  padding:calc(var(--u)*2) calc(var(--u)*3); border:1px dashed var(--bd-strong);
  border-radius:var(--r-pan); background:var(--elev);
}
.drop-k { font-size:var(--t-cap); font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); }
.drop-e { font-size:var(--t-cap); color:var(--ink3); font-style:italic; }
.pill {
  display:inline-flex; align-items:center; gap:calc(var(--u)*1.5); height:24px; padding-inline:calc(var(--u)*2);
  border-radius:999px; border:1px solid var(--a2-b); background:var(--a2-s); color:var(--a2-t);
  font-size:var(--t-cap); cursor:pointer; white-space:nowrap;
}
.pill.t-dim { border-color:var(--int-b); background:var(--int-s); color:var(--int-t); }
.pill.is-on { box-shadow:0 0 0 1px currentColor; }
.issue {
  display:flex; gap:calc(var(--u)*3); padding:calc(var(--u)*3); border:1px solid var(--warn-b);
  border-radius:var(--r-pan); background:var(--warn-s); color:var(--warn-t); cursor:pointer;
  text-align:left; width:100%; align-items:flex-start;
}

/* ---------- context: two halves, in and out ---------- */
.halves { display:grid; grid-template-columns:1fr auto 1fr; gap:calc(var(--u)*4); align-items:stretch; }
.half { display:flex; flex-direction:column; gap:calc(var(--u)*2); min-width:0; }
.half-h { display:flex; align-items:center; gap:calc(var(--u)*2); }
.half-t { font-size:var(--t-cap); font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
.half.is-in .half-t { color:var(--ok-t); }
.half.is-out .half-t { color:var(--err-t); }
.half-b { flex:1; border:1px solid var(--bd); border-radius:var(--r-pan); background:var(--elev); overflow:hidden; }
.half.is-in .half-b { border-color:var(--ok-b); }
.half.is-out .half-b { border-color:var(--err-b); }
.minus { align-self:center; display:grid; place-items:center; width:28px; height:28px; border-radius:50%; border:1px solid var(--bd-strong); color:var(--ink3); font-size:var(--t-lg); background:var(--panel); }

/* ---------- personas: a profile ---------- */
.profile { display:flex; align-items:flex-start; gap:calc(var(--u)*4); }
.profile-m { flex:1; min-width:0; display:flex; flex-direction:column; gap:calc(var(--u)*1); }
.stat-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:calc(var(--u)*3); }
.stat { border:1px solid var(--bd); border-radius:var(--r-pan); background:var(--elev); padding:calc(var(--u)*3); display:flex; flex-direction:column; gap:2px; }
.stat-n { font-size:var(--t-h4); font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.stat-k { font-size:var(--t-cap); color:var(--ink3); }

/* split layout used by overview and elsewhere */
.split { display:grid; grid-template-columns:1fr 1fr; gap:calc(var(--u)*5); align-items:start; }
.split.is-3-2 { grid-template-columns:1.4fr 1fr; }
.split.is-2-3 { grid-template-columns:1fr 1.6fr; }

/* mock-only affordance marker */
.mocklab { font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ai-t); }
/* Deck aids live in the bezel and are drawn dashed, so nothing here can be
   mistaken for a control the application has. */
.dk-aid { display:flex; align-items:center; gap:calc(var(--u)*1.5); }
.dk-aid > .dk-k { font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--bez-accent); }
.dk-sel.is-aid, .dk-btn.is-aid { border-style:dashed; border-color:var(--bez-accent); min-width:0; }
.dk-sel.is-aid { max-width:170px; }
.dk-btn.is-aid.is-on { background:var(--bez-accent); border-style:solid; color:var(--bez); font-weight:600; }

/* ---------- spec-notes drawer ---------- */
.notes-d {
  position:fixed; inset-inline:0; bottom:0; max-height:56dvh; z-index:60;
  display:none; flex-direction:column; background:var(--bez); border-top:1px solid var(--bez-bd); color:var(--bez-ink);
  box-shadow:0 -12px 32px -8px rgba(0,0,0,.5);
}
.notes-d.is-open { display:flex; }
.nd-h { display:flex; align-items:center; gap:calc(var(--u)*3); padding:calc(var(--u)*2.5) calc(var(--u)*5); border-bottom:1px solid var(--bez-bd); }
.nd-t { font-size:var(--t-lab); font-weight:600; }
.nd-p { font-family:var(--mono); font-size:var(--t-cap); color:var(--bez-ink2); }
.nd-b { flex:1; min-height:0; overflow-y:auto; padding:calc(var(--u)*4) calc(var(--u)*5) calc(var(--u)*6); display:grid; gap:calc(var(--u)*6); grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
.nd-s { display:flex; flex-direction:column; gap:calc(var(--u)*2); }
.nd-k { font-size:var(--t-cap); font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--bez-ink2); }
.nd-l { margin:0; padding-inline-start:calc(var(--u)*4); display:flex; flex-direction:column; gap:calc(var(--u)*1.5); font-size:var(--t-cap); line-height:1.05rem; color:var(--bez-ink); }
.nd-l li::marker { color:var(--bez-ink2); }
.nd-l code { font-family:var(--mono); color:var(--bez-on); }
.nd-gap { border-inline-start:2px solid var(--warn-b); padding-inline-start:calc(var(--u)*3); }
.nd-gap li::marker { color:var(--warn-b); }
.nd-new { border-inline-start:2px solid var(--bez-accent); padding-inline-start:calc(var(--u)*3); }
.nd-new li::marker { color:var(--bez-accent); }
</style>

<div class="deck">

    </aside>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   Icons — 24px stroke glyphs, drawn here so the page stays
   self-contained. Keys read like the Lucide names the app uses.
   ============================================================ */
const P = {

filter:"M3 5h18l-7 8v6l-4 2v-8z",

x:"M6 6l12 12M18 6L6 18",

book:"M4 4h7a2 2 0 012 2v14a2 2 0 00-2-2H4zM20 4h-7a2 2 0 00-2 2v14a2 2 0 012-2h7z",
pin:"M12 3v7M8 10h8l2 5H6zM12 15v6",
move:"M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3",
sun:"M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4",
help:"M12 3a9 9 0 100 18 9 9 0 000-18zM9.5 9.5a2.5 2.5 0 114 2c-.9.7-1.5 1.2-1.5 2.5M12 17.2h.01",
at:"M12 8a4 4 0 100 8 4 4 0 000-8zM16 12v1.5a2.5 2.5 0 005 0V12a9 9 0 10-3.5 7.1",
pal:"M12 3a9 9 0 000 18 2 2 0 001.7-3c-.5-.8.1-1.9 1-1.9H18a3 3 0 003-3.4C20.4 6.5 16.7 3 12 3zM7.5 10a1 1 0 100 .01M11 7a1 1 0 100 .01M15.5 8.5a1 1 0 100 .01",
};
const ic = (n, s) => {
  const d = P[n]; if (!d) return "";
  const px = s || 15;
  return `<svg class="ic" width="${px}" height="${px}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
};

/* ============================================================
   Wireframe primitives. Every screen is composed from these,
   so a change to density lands everywhere at once.
   ============================================================ */
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

/** A collapsible section. Used identically by panel and inspector. */
const sec = (title, body, o = {}) => `
  <div class="sec${o.shut ? " is-shut" : ""}" data-sec>
    <button class="sec-h" type="button" data-sec-t>
      <span class="sec-c">${ic("chevD", 13)}</span>
      <span class="sec-t">${esc(title)}</span>
      ${o.count != null ? `<span class="sec-n">${esc(o.count)}</span>` : ""}
    </button>
    <div class="sec-b${o.flush ? " is-flush" : ""}">${body}</div>
  </div>`;

const row = (t, o = {}) => `
  <button class="row${o.on ? " is-on" : ""}${o.sub ? " is-sub" : ""}" type="button"${o.inspect ? ` data-inspect="${esc(o.inspect)}"` : ""}>
    ${o.icon ? `<span class="row-i">${ic(o.icon, o.iconSize || 15)}</span>` : ""}
    <span class="row-m">
      <span class="row-t">${t}</span>
      ${o.sub2 ? `<span class="row-s">${o.sub2}</span>` : ""}
    </span>
    ${o.right ? `<span class="row-x">${o.right}</span>` : ""}
  </button>`;

const field = (k, v, o = {}) => `<div class="fld"><span class="fld-k">${esc(k)}</span><span class="fld-v${o.mono ? " is-mono" : ""}">${v}</span></div>`;
const chip = (t, tone) => `<span class="chip${tone ? " t-" + tone : ""}">${t}</span>`;
const sq = (t, tone) => `<span class="chip is-sq${tone ? " t-" + tone : ""}">${esc(t)}</span>`;
const btn = (t, o = {}) => `<button class="btn${o.k ? " is-" + o.k : ""}${o.sm ? " is-sm" : ""}${o.big ? " is-big" : ""}" type="button"${o.dis ? " disabled" : ""}${o.act ? ` data-act="${esc(o.act)}"` : ""}${o.inspect ? ` data-inspect="${esc(o.inspect)}"` : ""}>${o.icon ? ic(o.icon, 14) : ""}${t}</button>`;
const search = (ph, v) => `<div class="inp${v ? " is-filled" : ""}">${ic("search", 14)}<span class="inp-w">${esc(v || ph)}</span></div>`;
const note = (t, o = {}) => `<p class="note${o.warn ? " is-warn" : ""}">${t}</p>`;
const gap = (t) => `<div class="gap-note"><span class="row-i">${ic("warn", 14)}</span><span>${t}</span></div>`;
const card = (t, s, o = {}) => `<button class="card${o.on ? " is-on" : ""}" type="button"${o.inspect ? ` data-inspect="${esc(o.inspect)}"` : ""}${o.act ? ` data-act="${esc(o.act)}"` : ""}>${o.icon ? `<span class="card-i">${ic(o.icon, 18)}</span>` : ""}<span class="card-t">${t}</span>${s ? `<span class="card-s">${s}</span>` : ""}${o.foot || ""}</button>`;
const mk = (t, icon, o = {}) => `<button class="mkpill${o.on ? " is-on" : ""}" type="button"${o.inspect ? ` data-inspect="${esc(o.inspect)}"` : ""}>${ic(icon, 17)}${esc(t)}</button>`;
/** An avatar. `name` is what hovering says — nothing more is needed to know who it is. */
const av = (initials, tone, o = {}) => `<span class="av${o.lg ? " is-lg" : ""}" style="background:var(--${tone}-f)"${o.name ? ` title="${esc(o.name)}"` : ""}>${esc(initials)}</span>`;
/** A selectable avatar. Clicking inspects the actor; never used inside another button. */
const avb = (initials, tone, o = {}) =>
  `<button class="av-b" type="button" title="${esc(o.name || initials)}" aria-label="${esc(o.name || initials)}" data-inspect="${esc(o.inspect || "actor")}">${av(initials, tone, o)}</button>`;
const kv = (rows) => rows.map(([k, v, o]) => field(k, v, o || {})).join("");
const stat = (n, k) => `<div class="stat"><span class="stat-n">${esc(n)}</span><span class="stat-k">${esc(k)}</span></div>`;
const table = (cols, rows) => `
  <div class="tbl-w"><div class="tbl-c"><table class="tbl">
    <thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((r) => `<tr${r.on ? ' class="is-on"' : ""}${r.inspect ? ` data-inspect="${esc(r.inspect)}"` : ""}>${r.cells.map((c) => `<td${c.cls ? ` class="${c.cls}"` : ""}>${c.h}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div></div>`;

/** Panel scaffold: fixed header, optional action row, optional search, body, footer. */
const pane = (title, body, o = {}) => `
  <div class="pane-h"><span class="pane-t">${esc(title)}</span>${o.head || ""}<button class="ico-btn" type="button" data-act="ctx-shut" aria-label="Collapse the context panel">${ic("chevL", 14)}</button></div>
  ${o.actions ? `<div class="pane-a">${o.actions}</div>` : ""}
  ${o.search ? `<div class="pane-s">${o.search}</div>` : ""}
  <div class="pane-b">${body}</div>
  ${o.foot ? `<div class="pane-f">${o.foot}</div>` : ""}`;

/**
 * Inspector scaffold. Ancestry is navigable: each crumb is `[label, key]` and
 * selecting one inspects that ancestor, which is the cheapest way up a nesting
 * a canvas or a table makes easy to fall into.
 */
const lens = (crumbs, body) => `
  <div class="pane-h">
    <span class="crumb">${crumbs.map((c, i) => {
      const [label, key] = Array.isArray(c) ? c : [c, null];
      const here = i === crumbs.length - 1;
      return `<button class="crumb-b${here ? " is-here" : ""}" type="button"${!here && key ? ` data-inspect="${esc(key)}"` : ""}${here ? " disabled" : ""}>${esc(label)}</button>${here ? "" : `<i>/</i>`}`;
    }).join("")}</span>
    <button class="ico-btn" type="button" data-act="insp-shut" aria-label="Collapse the inspector">${ic("x", 14)}</button>
  </div>
  <div class="insp-b">${body}</div>`;
