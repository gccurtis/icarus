    embedding:
      # ONE embedding model, everywhere, deliberately.
      #
      # Unlike reasoning, embedding has no meaningful tier ladder to climb: every
      # vector we store must be comparable with every other, and two models put
      # their vectors in different spaces. Varying the model by strength/speed/
      # cost would mean a cast change silently made the corpus unsearchable, so
      # all 27 general coordinates resolve to the same model on purpose. Cost is
      # not the deciding factor — embeddings are cheap next to reasoning — so
      # this is the quality choice, not the thrifty one.
      #
      # It is text-embedding-3-small. Large costs ~6.5x for a few points of
      # benchmark quality, and its 3072 dimensions double both stored vector size
      # and comparison work — which lands on every dot product descent takes and
      # doubles the 6KB each window's vector already costs to store (measured:
      # vectors run ~1.5x the source text). It must also be solid under sustained
      # load, which is where the earlier candidates failed (on throughput, not
      # quality): the free Nemotron returned empty vector lists, and
      # qwen3-embedding-4b answered a full suite run with 121 HTTP 429s while
      # handling isolated probes perfectly.
      #
      # Changing this invalidates every stored vector — a migration, not a swap.
      # Free only while there is no real data.
      #
      - { purpose: general, strength: high  , speed: low   , cost: low   , provider: openrouter, model: "openai/text-embedding-3-small" }
